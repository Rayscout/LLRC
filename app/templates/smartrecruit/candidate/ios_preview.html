<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS风格预览 - 求职者仪表盘</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* CSS变量定义 */
        :root {
            /* 亮色模式 */
            --ios-background: #F2F2F7;
            --ios-card-background: rgba(255, 255, 255, 0.8);
            --ios-text-primary: #000000;
            --ios-text-secondary: #8E8E93;
            --ios-text-tertiary: #C7C7CC;
            --ios-accent: #007AFF;
            --ios-accent-hover: #0056CC;
            --ios-border: rgba(0, 0, 0, 0.1);
            --ios-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            --ios-shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.16);
            --ios-blur: blur(20px);
            --ios-transition: cubic-bezier(0.25, 1, 0.5, 1);
        }

        [data-theme="dark"] {
            /* 深色模式 */
            --ios-background: #000000;
            --ios-card-background: rgba(44, 44, 46, 0.8);
            --ios-text-primary: #FFFFFF;
            --ios-text-secondary: #8E8E93;
            --ios-text-tertiary: #48484A;
            --ios-accent: #0A84FF;
            --ios-accent-hover: #409CFF;
            --ios-border: rgba(255, 255, 255, 0.1);
            --ios-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --ios-shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.5);
        }

        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--ios-background);
            color: var(--ios-text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background-color 0.3s var(--ios-transition);
        }

        /* 导航栏 */
        .ios-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: var(--ios-blur);
            -webkit-backdrop-filter: var(--ios-blur);
            border-bottom: 1px solid var(--ios-border);
            transition: all 0.3s var(--ios-transition);
        }

        [data-theme="dark"] .ios-navbar {
            background: rgba(44, 44, 46, 0.8);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-center {
            flex: 1;
            text-align: center;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--ios-text-primary);
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ios-text-primary);
            cursor: pointer;
            transition: all 0.2s var(--ios-transition);
        }

        .nav-btn:hover {
            background: var(--ios-border);
        }

        .user-avatar img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* 主容器 */
        .ios-container {
            padding-top: 60px;
        }

        /* Section样式 */
        .ios-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            scroll-snap-align: start;
        }

        .section-content {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--ios-accent), var(--ios-accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-subtitle {
            font-size: 20px;
            color: var(--ios-text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* 卡片样式 */
        .hero-card, .skills-card, .learning-card, .action-card {
            background: var(--ios-card-background);
            backdrop-filter: var(--ios-blur);
            -webkit-backdrop-filter: var(--ios-blur);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--ios-shadow);
            border: 1px solid var(--ios-border);
            transition: all 0.3s var(--ios-transition);
        }

        .hero-card:hover, .skills-card:hover, .learning-card:hover, .action-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--ios-shadow-hover);
        }

        /* 英雄区域 */
        .hero-section {
            background: linear-gradient(135deg, var(--ios-accent), var(--ios-accent-hover));
            color: white;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .hero-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .hero-subtitle {
            font-size: 20px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.8;
        }

        .hero-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* 按钮样式 */
        .ios-button {
            padding: 16px 32px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s var(--ios-transition);
            backdrop-filter: blur(10px);
        }

        .ios-button-primary {
            background: var(--ios-accent);
            color: white;
        }

        .ios-button-primary:hover {
            background: var(--ios-accent-hover);
            transform: translateY(-2px);
        }

        .ios-button-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .ios-button-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .ios-button-outline {
            background: transparent;
            color: var(--ios-accent);
            border: 2px solid var(--ios-accent);
        }

        .ios-button-outline:hover {
            background: var(--ios-accent);
            color: white;
        }

        /* 技能区域 */
        .skills-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .skill-tag {
            background: var(--ios-accent);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .skills-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        /* 操作网格 */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .action-card {
            text-align: center;
            padding: 32px 24px;
            text-decoration: none;
            color: inherit;
        }

        .action-icon {
            width: 64px;
            height: 64px;
            background: var(--ios-accent);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 24px;
            color: white;
        }

        .action-card h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--ios-text-primary);
        }

        .action-card p {
            color: var(--ios-text-secondary);
            margin-bottom: 20px;
        }

        .action-stats {
            font-size: 14px;
            color: var(--ios-text-tertiary);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .section-title {
                font-size: 32px;
            }
            
            .hero-title {
                font-size: 32px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .actions-grid {
                grid-template-columns: 1fr;
            }
            
            .hero-actions {
                flex-direction: column;
            }
            
            .ios-navbar {
                padding: 0 16px;
            }
        }

        /* 滚动行为 */
        html {
            scroll-behavior: smooth;
        }

        /* 自动适配系统主题 */
        @media (prefers-color-scheme: dark) {
            :root {
                --ios-background: #000000;
                --ios-card-background: rgba(44, 44, 46, 0.8);
                --ios-text-primary: #FFFFFF;
                --ios-text-secondary: #8E8E93;
                --ios-text-tertiary: #48484A;
                --ios-accent: #0A84FF;
                --ios-accent-hover: #409CFF;
                --ios-border: rgba(255, 255, 255, 0.1);
                --ios-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
                --ios-shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.5);
            }
        }
    </style>
</head>
<body>
    <!-- iOS风格导航栏 -->
    <nav class="ios-navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <button class="nav-btn" onclick="history.back()">
                    <i class="fas fa-arrow-left"></i>
                </button>
            </div>
            <div class="nav-center">
                <h1 class="nav-title">iOS风格预览</h1>
            </div>
            <div class="nav-right">
                <button class="nav-btn" onclick="toggleTheme()">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <div class="user-avatar">
                    <img src="https://via.placeholder.com/32x32" alt="用户头像">
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要内容容器 -->
    <div class="ios-container">
        <!-- Section 1: 欢迎横幅 -->
        <section class="ios-section hero-section" id="hero">
            <div class="section-content">
                <div class="hero-card">
                    <div class="hero-content">
                        <h1 class="hero-title">欢迎回来，张三！</h1>
                        <p class="hero-subtitle">基于您的技能为您推荐匹配职位，管理您的求职申请</p>
                        
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-number">4</div>
                                <div class="stat-label">申请数量</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">3</div>
                                <div class="stat-label">收藏职位</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">87%</div>
                                <div class="stat-label">资料完整度</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="hero-actions">
                        <a href="#" class="ios-button ios-button-primary">
                            <i class="fas fa-search"></i>
                            搜索职位
                        </a>
                        <a href="#" class="ios-button ios-button-secondary">
                            <i class="fas fa-cog"></i>
                            个人设置
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Section 2: 技能匹配 -->
        <section class="ios-section skills-section" id="skills">
            <div class="section-content">
                <div class="section-header">
                    <h2 class="section-title">🎯 您的技能匹配</h2>
                    <p class="section-subtitle">基于您的简历分析，为您推荐最适合的职位</p>
                </div>
                
                <div class="skills-card">
                    <div class="skills-tags">
                        <span class="skill-tag">Python</span>
                        <span class="skill-tag">数据分析</span>
                        <span class="skill-tag">机器学习</span>
                        <span class="skill-tag">项目管理</span>
                        <span class="skill-tag">团队协作</span>
                    </div>
                    
                    <div class="skills-actions">
                        <button class="ios-button ios-button-outline">
                            <i class="fas fa-edit"></i>
                            更新技能
                        </button>
                        <button class="ios-button ios-button-outline">
                            <i class="fas fa-file-alt"></i>
                            分析简历
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Section 3: 快速操作 -->
        <section class="ios-section actions-section" id="actions">
            <div class="section-content">
                <div class="section-header">
                    <h2 class="section-title">🚀 快速操作</h2>
                    <p class="section-subtitle">高效管理您的求职流程</p>
                </div>
                
                <div class="actions-grid">
                    <a href="#" class="action-card">
                        <div class="action-icon">
                            <i class="fas fa-search"></i>
                        </div>
                        <h3>搜索职位</h3>
                        <p>基于技能和偏好找到最适合的职位</p>
                        <div class="action-stats">
                            <span>今日新增: <strong>12</strong></span>
                        </div>
                    </a>
                    
                    <a href="#" class="action-card">
                        <div class="action-icon">
                            <i class="fas fa-upload"></i>
                        </div>
                        <h3>上传简历</h3>
                        <p>支持多种格式：PDF、Word、图片、视频</p>
                        <div class="action-stats">
                            <span>简历状态: <strong>已上传</strong></span>
                        </div>
                    </a>
                    
                    <a href="#" class="action-card">
                        <div class="action-icon">
                            <i class="fas fa-clipboard-list"></i>
                        </div>
                        <h3>我的申请</h3>
                        <p>查看和管理所有职位申请状态</p>
                        <div class="action-stats">
                            <span>待处理: <strong>2</strong></span>
                        </div>
                    </a>
                    
                    <a href="#" class="action-card">
                        <div class="action-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <h3>职业发展</h3>
                        <p>技能差距分析和学习建议</p>
                        <div class="action-stats">
                            <span>技能匹配: <strong>85%</strong></span>
                        </div>
                    </a>
                </div>
            </div>
        </section>
    </div>

    <script>
        // 主题切换
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            // 更新图标
            const themeIcon = document.getElementById('themeIcon');
            themeIcon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        // 导航栏滚动效果
        function handleScroll() {
            const navbar = document.getElementById('navbar');
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            if (scrollTop > 50) {
                navbar.style.background = 'rgba(255, 255, 255, 0.95)';
                if (document.documentElement.getAttribute('data-theme') === 'dark') {
                    navbar.style.background = 'rgba(44, 44, 46, 0.95)';
                }
            } else {
                navbar.style.background = 'rgba(255, 255, 255, 0.8)';
                if (document.documentElement.getAttribute('data-theme') === 'dark') {
                    navbar.style.background = 'rgba(44, 44, 46, 0.8)';
                }
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化主题
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (prefersDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            
            // 更新图标
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const themeIcon = document.getElementById('themeIcon');
            themeIcon.className = currentTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            
            // 监听滚动事件
            window.addEventListener('scroll', handleScroll);
            
            // 监听系统主题变化
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) {
                    document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
                }
            });
        });
    </script>
</body>
</html>
