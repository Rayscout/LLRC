{% extends 'smartrecruit/candidate/base_ios_new.html' %}

{% block title %}表情识别测试{% endblock %}

{% block content %}
<style>
  .test-container { max-width: 800px; margin: 20px auto; padding: 20px; }
  .test-card { background: var(--bg-card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
  .test-btn { padding: 12px 20px; margin: 10px; border-radius: 8px; border: none; cursor: pointer; background: var(--accent-primary); color: white; }
  .test-btn:hover { opacity: 0.8; }
  .log-area { background: #f5f5f5; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin: 15px 0; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
  .status { padding: 10px; margin: 10px 0; border-radius: 6px; }
  .status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
  .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  .status.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
</style>

<div class="test-container">
  <div class="test-card">
    <h2>🧪 表情识别功能测试</h2>
    <p>这个页面用于测试表情识别功能是否正常工作。</p>
    
    <div class="status info">
      <strong>测试步骤：</strong>
      <ol>
        <li>点击"测试API连接"检查后端服务</li>
        <li>点击"测试模型加载"检查YOLO模型</li>
        <li>点击"测试表情识别"进行完整测试</li>
        <li>查看下方日志了解详细情况</li>
      </ol>
    </div>
    
    <div>
      <button class="test-btn" onclick="testApiConnection()">测试API连接</button>
      <button class="test-btn" onclick="testModelLoading()">测试模型加载</button>
      <button class="test-btn" onclick="testEmotionRecognition()">测试表情识别</button>
      <button class="test-btn" onclick="clearLogs()">清除日志</button>
    </div>
  </div>

  <div class="test-card">
    <h3>测试结果</h3>
    <div id="testResults"></div>
  </div>

  <div class="test-card">
    <h3>详细日志</h3>
    <div id="logArea" class="log-area"></div>
  </div>
</div>

<script>
  function log(message, type = 'info') {
    const logArea = document.getElementById('logArea');
    const timestamp = new Date().toLocaleTimeString();
    const logEntry = document.createElement('div');
    logEntry.innerHTML = `[${timestamp}] ${message}`;
    logEntry.style.color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'black';
    logArea.appendChild(logEntry);
    logArea.scrollTop = logArea.scrollHeight;
  }

  function showStatus(message, type) {
    const resultsDiv = document.getElementById('testResults');
    const statusDiv = document.createElement('div');
    statusDiv.className = `status ${type}`;
    statusDiv.textContent = message;
    resultsDiv.appendChild(statusDiv);
  }

  async function testApiConnection() {
    log('开始测试API连接...');
    
    try {
      const response = await fetch('/candidate/ai-analysis/health-check');
      log(`API响应状态: ${response.status}`);
      
      if (response.ok) {
        const result = await response.json();
        log(`API响应成功: ${JSON.stringify(result)}`);
        showStatus('✅ API连接正常', 'success');
      } else {
        log(`API响应失败: ${response.status} ${response.statusText}`);
        showStatus('❌ API连接失败', 'error');
      }
    } catch (error) {
      log(`API连接错误: ${error.message}`, 'error');
      showStatus('❌ API连接错误', 'error');
    }
  }

  async function testModelLoading() {
    log('开始测试模型加载...');
    
    try {
      const response = await fetch('/candidate/ai-analysis/supported-formats');
      log(`模型检查响应状态: ${response.status}`);
      
      if (response.ok) {
        const result = await response.json();
        log(`模型检查结果: ${JSON.stringify(result)}`);
        showStatus('✅ 模型检查完成', 'success');
      } else {
        log(`模型检查失败: ${response.status} ${response.statusText}`);
        showStatus('❌ 模型检查失败', 'error');
      }
    } catch (error) {
      log(`模型检查错误: ${error.message}`, 'error');
      showStatus('❌ 模型检查错误', 'error');
    }
  }

  async function testEmotionRecognition() {
    log('开始测试表情识别...');
    
    try {
      // 创建一个测试图片
      const canvas = document.createElement('canvas');
      canvas.width = 100;
      canvas.height = 100;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'red';
      ctx.fillRect(0, 0, 100, 100);
      
      canvas.toBlob(async (blob) => {
        if (!blob) {
          log('无法创建测试图片', 'error');
          showStatus('❌ 测试图片创建失败', 'error');
          return;
        }
        
        log(`测试图片创建成功，大小: ${blob.size} bytes`);
        
        const formData = new FormData();
        formData.append('image', blob, 'test.jpg');
        
        log('发送表情识别请求...');
        
        const response = await fetch('/smartrecruit/candidate/ai-analysis/emotion-analysis', {
          method: 'POST',
          body: formData
        });
        
        log(`表情识别响应状态: ${response.status}`);
        
        if (response.ok) {
          const result = await response.json();
          log(`表情识别结果: ${JSON.stringify(result)}`);
          
          if (result.success) {
            showStatus('✅ 表情识别测试成功', 'success');
          } else {
            showStatus('⚠️ 表情识别返回失败', 'error');
          }
        } else {
          const errorText = await response.text();
          log(`表情识别失败: ${response.status} ${response.statusText}`);
          log(`错误详情: ${errorText}`);
          showStatus('❌ 表情识别测试失败', 'error');
        }
      }, 'image/jpeg', 0.8);
      
    } catch (error) {
      log(`表情识别测试错误: ${error.message}`, 'error');
      showStatus('❌ 表情识别测试错误', 'error');
    }
  }

  function clearLogs() {
    document.getElementById('logArea').innerHTML = '';
    document.getElementById('testResults').innerHTML = '';
    log('日志已清除');
  }

  // 页面加载完成后的初始化
  document.addEventListener('DOMContentLoaded', function() {
    log('表情识别测试页面已加载');
    log('请按照测试步骤进行测试');
  });
</script>
{% endblock %}
