<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>通知详情</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth_sign.css') }}" />
</head>
<body>
    <div style="max-width: 840px; margin: 40px auto;">
        <a href="{{ url_for('talent_management.hr_admin.talent_demand.hr_inbox') }}" style="display:inline-block; margin-bottom:12px; text-decoration:none;">← 返回列表</a>
        <div style="background:#fff; border:1px solid #eee; border-radius:10px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.04);">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
                <h1 style="margin:0; font-size:20px;">{{ n.title }}</h1>
                <div style="font-size:12px; color:#999;">{{ n.created_at.strftime('%Y-%m-%d %H:%M') }}</div>
            </div>
            <div style="margin-top:8px; color:#666; font-size:14px;">
                来自：{{ n.executive_name }}（{{ n.executive_email }}）
            </div>
            <div style="margin-top:16px;">
                <div style="margin-bottom:8px; font-weight:600;">关键词：</div>
                <div style="background:#fafafa; border:1px solid #eee; border-radius:8px; padding:12px;">{{ n.keyword }}</div>
            </div>
            {% if n.description %}
            <div style="margin-top:16px;">
                <div style="margin-bottom:8px; font-weight:600;">描述：</div>
                <div style="background:#fafafa; border:1px solid #eee; border-radius:8px; padding:12px; white-space:pre-wrap;">{{ n.description }}</div>
            </div>
            {% endif %}
            <div style="margin-top:16px;">
                <div style="margin-bottom:8px; font-weight:600;">消息：</div>
                <div style="white-space:pre-wrap;">{{ n.message }}</div>
            </div>
            <form method="post" action="{{ url_for('talent_management.hr_admin.talent_demand.mark_read', notification_id=n.id) }}" style="margin-top:16px;">
                <button type="submit" style="padding:10px 16px; border:none; background:#28a745; color:#fff; border-radius:8px; cursor:pointer;">标记为已读</button>
            </form>
            <form method="post" action="{{ url_for('talent_management.hr_admin.talent_demand.go_publish', notification_id=n.id) }}" style="margin-top:12px;">
                <button type="submit" style="padding:10px 16px; border:none; background:#007bff; color:#fff; border-radius:8px; cursor:pointer;">一键去发布职位</button>
            </form>
        </div>
    </div>
</body>
</html>
