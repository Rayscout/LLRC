<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布人才需求 - 高管管理系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #F2F2F7;
            --bg-secondary: rgba(255, 255, 255, 0.8);
            --bg-card: rgba(255, 255, 255, 0.9);
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --text-tertiary: #C7C7CC;
            --accent-blue: #007AFF;
            --accent-green: #34C759;
            --accent-orange: #FF9500;
            --accent-red: #FF3B30;
            --accent-purple: #AF52DE;
            --shadow-light: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 8px 30px rgba(0, 0, 0, 0.12);
            --border-radius: 16px;
            --border-radius-large: 24px;
            --transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            --transition-fast: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: rgba(44, 44, 46, 0.8);
            --bg-card: rgba(44, 44, 46, 0.9);
            --text-primary: #FFFFFF;
            --text-secondary: #EBEBF5;
            --text-tertiary: #8E8E93;
            --accent-blue: #0A84FF;
            --accent-green: #30D158;
            --accent-orange: #FF9F0A;
            --accent-red: #FF453A;
            --accent-purple: #BF5AF2;
            --shadow-light: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-medium: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: var(--transition);
            animation: fadeIn 0.6s ease-out;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Animated Light Blue Background */
        .executive-parallax-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(-45deg, #87CEEB, #B0E0E6, #ADD8E6, #E0F6FF, #F0F8FF);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: -1;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Floating Background Elements */
        .executive-parallax-bg::before,
        .executive-parallax-bg::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 20s ease-in-out infinite;
        }

        .executive-parallax-bg::before {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .executive-parallax-bg::after {
            bottom: 10%;
            right: 10%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.3;
            }
            25% {
                transform: translateY(-50px) rotate(90deg);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-100px) rotate(180deg);
                opacity: 0.3;
            }
            75% {
                transform: translateY(-50px) rotate(270deg);
                opacity: 0.6;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition-fast);
            animation: slideInLeft 0.6s ease-out;
            animation-delay: 0.1s;
            animation-fill-mode: both;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        .back-link i {
            margin-right: 8px;
        }

        .header {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius-large);
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideInDown 0.8s ease-out;
            text-align: center;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 3.2em;
            font-weight: 800;
            margin-bottom: 15px;
            color: var(--accent-blue);
            text-shadow: 0 4px 8px rgba(0, 122, 255, 0.3);
            animation: titleGlow 2s ease-in-out infinite alternate, fadeInUp 1s ease-out forwards;
            transform: translateY(30px);
            opacity: 0;
            letter-spacing: -0.02em;
            position: relative;
        }

        .header h1 i {
            color: var(--accent-orange);
            margin-right: 15px;
        }

        .header p {
            font-size: 1.4em;
            font-weight: 600;
            color: var(--accent-green);
            text-shadow: 0 2px 4px rgba(52, 199, 89, 0.3);
            font-style: italic;
            animation: fadeInUp 1s ease-out 0.5s forwards;
            transform: translateY(20px);
            opacity: 0;
        }

        @keyframes titleGlow {
            0% {
                opacity: 1;
                text-shadow: 0 4px 8px rgba(0, 122, 255, 0.3);
            }
            100% {
                opacity: 0.8;
                text-shadow: 0 4px 16px rgba(0, 122, 255, 0.6);
            }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-container {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius-large);
            padding: 40px;
            box-shadow: var(--shadow-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideInUp 0.8s ease-out;
            animation-delay: 0.3s;
            animation-fill-mode: both;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-grid {
            display: grid;
            gap: 25px;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .form-group label i {
            color: var(--accent-blue);
            font-size: 1.2em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(0, 122, 255, 0.1);
            border-radius: var(--border-radius);
            font-size: 1em;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-primary);
            transition: var(--transition-fast);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            animation: slideInUp 0.8s ease-out;
            animation-delay: 0.5s;
            animation-fill-mode: both;
        }

        .btn {
            padding: 16px 32px;
            border-radius: var(--border-radius);
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 122, 255, 0.4);
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: var(--bg-card);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            animation: slideInUp 0.8s ease-out;
            animation-delay: 0.7s;
            animation-fill-mode: both;
        }

        .feature-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition-fast);
            text-align: center;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-medium);
        }

        .feature-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            color: white;
            margin: 0 auto 15px;
        }

        .feature-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .feature-desc {
            font-size: 0.9em;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .required {
            color: var(--accent-red);
        }

        .placeholder-hint {
            font-size: 0.9em;
            color: var(--text-secondary);
            margin-top: 5px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 2.5em;
            }

            .form-container {
                padding: 25px 20px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                justify-content: center;
            }

            .feature-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 成功提示动画 */
        .success-message {
            background: linear-gradient(135deg, var(--accent-green), #30D158);
            color: white;
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: successSlide 0.5s ease-out;
            box-shadow: 0 4px 20px rgba(52, 199, 89, 0.3);
        }

        @keyframes successSlide {
            from {
                opacity: 0;
                transform: translateX(-100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 视差背景 -->
    <div class="executive-parallax-bg"></div>
    
    <div class="container">
        <a href="{{ url_for('talent_management.hr_admin.executive_dashboard') }}" class="back-link">
            <i class="fas fa-arrow-left"></i> 返回高管首页
        </a>

        <div class="header">
            <h1>
                <i class="fas fa-users-cog"></i>
                发布人才需求
            </h1>
            <p>智能匹配优质人才，助力团队发展壮大</p>
        </div>

        <!-- 功能特色展示 -->
        <div class="feature-grid">
            <div class="feature-card">
                <div class="feature-icon" style="background: var(--accent-blue);">
                    <i class="fas fa-brain"></i>
                </div>
                <div class="feature-title">AI智能匹配</div>
                <div class="feature-desc">基于关键词自动匹配最合适的候选人</div>
            </div>

            <div class="feature-card">
                <div class="feature-icon" style="background: var(--accent-green);">
                    <i class="fas fa-rocket"></i>
                </div>
                <div class="feature-title">快速发布</div>
                <div class="feature-desc">简单填写需求，一键发布到全平台</div>
            </div>

            <div class="feature-card">
                <div class="feature-icon" style="background: var(--accent-orange);">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="feature-title">数据分析</div>
                <div class="feature-desc">实时跟踪招聘进度和效果分析</div>
            </div>
        </div>

        <div class="form-container">
            <form method="post" action="{{ url_for('talent_management.hr_admin.talent_demand.publish') }}" id="demandForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="keyword">
                            <i class="fas fa-key"></i>
                            核心技能关键词 <span class="required">*</span>
                        </label>
                        <input 
                            id="keyword" 
                            name="keyword" 
                            required 
                            placeholder="例如：Python算法工程师、数据分析专家、前端React开发" 
                            autocomplete="off"
                        />
                        <div class="placeholder-hint">
                            💡 提示：越具体的关键词，匹配效果越精准
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">
                            <i class="fas fa-file-alt"></i>
                            详细需求描述（可选）
                        </label>
                        <textarea 
                            id="description" 
                            name="description" 
                            rows="6" 
                            placeholder="可详细描述岗位职责、工作环境、团队规模、发展前景等信息，帮助候选人更好地了解职位..."
                        ></textarea>
                        <div class="placeholder-hint">
                            💼 建议包含：岗位职责、任职要求、薪资待遇、发展空间等
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i>
                        <span class="btn-text">立即发布需求</span>
                        <div class="loading-spinner"></div>
                    </button>
                    <a href="{{ url_for('talent_management.hr_admin.executive_dashboard') }}" class="btn btn-secondary">
                        <i class="fas fa-times"></i>
                        取消返回
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('demandForm');
            const submitBtn = form.querySelector('button[type="submit"]');
            const btnText = submitBtn.querySelector('.btn-text');
            const spinner = submitBtn.querySelector('.loading-spinner');

            // 表单提交处理
            form.addEventListener('submit', function(e) {
                // 显示加载状态
                submitBtn.disabled = true;
                btnText.textContent = '正在发布...';
                spinner.style.display = 'block';
                
                // 添加提交动画
                submitBtn.style.transform = 'scale(0.98)';
                
                setTimeout(() => {
                    submitBtn.style.transform = 'scale(1)';
                }, 150);
            });

            // 输入框焦点效果
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'translateY(-2px)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'translateY(0)';
                });
            });

            // 关键词输入提示
            const keywordInput = document.getElementById('keyword');
            const suggestions = [
                'Python数据分析师',
                'Java后端开发工程师',
                'React前端开发专家',
                'UI/UX设计师',
                '产品经理',
                '机器学习工程师',
                'DevOps运维工程师',
                '移动端开发工程师'
            ];

            keywordInput.addEventListener('input', function() {
                const value = this.value.toLowerCase();
                if (value.length > 0) {
                    // 这里可以添加智能提示功能
                    console.log('搜索建议:', suggestions.filter(s => 
                        s.toLowerCase().includes(value)
                    ));
                }
            });

            console.log('人才需求发布页面已加载');
        });

        // 页面加载动画
        window.addEventListener('load', function() {
            document.body.style.opacity = '1';
        });
    </script>
</body>
</html>
