<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拖拽调试测试</title>
    <style>
        .progress-container {
            position: relative;
            width: 300px;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            margin: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #007AFF;
            border-radius: 10px;
            width: 25%;
        }

        .progress-handle {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: white;
            border: 2px solid #007AFF;
            border-radius: 50%;
            cursor: grab;
        }

        .save-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 20px;
        }

        .debug-info {
            margin: 20px;
            padding: 10px;
            background: #f0f0f0;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>拖拽调试测试</h1>

    <div class="progress-container">
        <div class="progress-fill" id="progress-fill-1"></div>
        <div class="progress-handle" id="progress-handle-1" data-goal-id="1" data-max-hours="40"></div>
    </div>

    <button class="save-btn" id="save-btn-1" data-goal-id="1">保存</button>

    <div class="debug-info" id="debug-info">
        调试信息将显示在这里...
    </div>

    <script>
        // 存储待保存的更改
        let pendingChanges = new Set();

        // 调试信息显示
        function log(message) {
            const debugDiv = document.getElementById('debug-info');
            debugDiv.innerHTML += message + '<br>';
            console.log(message);
        }

        function initializeProgressBars() {
            log('初始化进度条...');

            // 为每个进度条添加事件监听器
            document.querySelectorAll('.progress-handle').forEach(handle => {
                const goalId = handle.dataset.goalId;
                const maxHours = parseInt(handle.dataset.maxHours);

                log(`绑定事件: goalId=${goalId}, maxHours=${maxHours}`);

                // 鼠标按下事件
                handle.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    log(`鼠标按下: goalId=${goalId}`);
                    startDragging(handle, goalId, maxHours);
                });
            });

            updateSaveButtonState();
        }

        function startDragging(handle, goalId, maxHours) {
            let isDragging = true;
            log(`开始拖拽: goalId=${goalId}, maxHours=${maxHours}`);

            function handleMouseMove(e) {
                if (!isDragging) return;

                const bar = handle.parentElement;
                const rect = bar.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const percentage = Math.max(0, Math.min(100, (mouseX / rect.width) * 100));

                log(`拖拽移动: percentage=${percentage.toFixed(1)}%`);

                updateProgressByPercentage(goalId, maxHours, percentage);
                // 标记该目标有待保存的更改 - 确保使用数字类型
                const numericGoalId = parseInt(goalId);
                log(`添加待保存更改: ${numericGoalId}, 当前pendingChanges: ${Array.from(pendingChanges)}`);
                pendingChanges.add(numericGoalId);
                updateSaveButtonState();
            }

            function handleMouseUp() {
                log(`拖拽结束: goalId=${goalId}`);
                isDragging = false;
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', handleMouseUp);
            }

            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        }

        function updateProgressByPercentage(goalId, maxHours, percentage) {
            const completedHours = Math.round((percentage / 100) * maxHours);
            updateProgressByHours(goalId, maxHours, completedHours);
        }

        function updateProgressByHours(goalId, maxHours, completedHours) {
            // 限制在有效范围内
            completedHours = Math.max(0, Math.min(maxHours, completedHours));
            const percentage = (completedHours / maxHours) * 100;

            log(`更新进度: goalId=${goalId}, completedHours=${completedHours}, percentage=${percentage.toFixed(1)}%`);

            // 更新UI
            const progressFill = document.getElementById(`progress-fill-${goalId}`);
            const progressHandle = document.getElementById(`progress-handle-${goalId}`);

            if (progressFill) progressFill.style.width = percentage + '%';
            if (progressHandle) progressHandle.style.left = percentage + '%';
        }

        function updateSaveButtonState() {
            const saveButtons = document.querySelectorAll('.save-btn');
            log(`更新按钮状态，找到按钮数量: ${saveButtons.length}, pendingChanges: ${Array.from(pendingChanges)}`);

            saveButtons.forEach(button => {
                const goalId = button.dataset.goalId;
                const numericGoalId = parseInt(goalId);
                const hasChanges = pendingChanges.has(numericGoalId);

                log(`按钮 goalId: ${goalId} (${typeof goalId}), numericGoalId: ${numericGoalId}, hasChanges: ${hasChanges}`);

                if (hasChanges) {
                    // 有待保存更改时的状态
                    button.style.background = 'linear-gradient(135deg, #FF9500 0%, #FF6B35 100%)';
                    button.innerHTML = '保存更改';
                } else {
                    // 无待保存更改时的状态
                    button.style.background = 'linear-gradient(135deg, #007AFF 0%, #5856D6 100%)';
                    button.innerHTML = '保存';
                }
            });
        }

        function saveProgress(goalId) {
            const numericGoalId = parseInt(goalId);
            log(`点击保存按钮，goalId: ${goalId}, numericGoalId: ${numericGoalId}, pendingChanges: ${Array.from(pendingChanges)}`);

            // 检查是否有待保存的更改
            if (!pendingChanges.has(numericGoalId)) {
                log('没有待保存的更改，显示提示');
                alert('无更改');
                return;
            }

            log('有待保存的更改，正在保存...');
            // 模拟保存成功
            setTimeout(() => {
                log('保存成功！');
                alert('保存成功！');

                // 从待保存列表中移除
                pendingChanges.delete(numericGoalId);
                updateSaveButtonState();
            }, 500);
        }

        // 绑定保存按钮事件
        document.querySelectorAll('.save-btn').forEach(button => {
            button.addEventListener('click', function() {
                const goalId = this.dataset.goalId;
                saveProgress(goalId);
            });
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            log('页面加载完成，开始初始化...');
            initializeProgressBars();
        });
    </script>
</body>
</html>
